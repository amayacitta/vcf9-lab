{{ if .Values.certmanager.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.certmanager.ClusterIssuer.name | default "tanzu-sub01-tls-secret" }}
  namespace: cert-manager
data:
  tls.crt: {{ .Values.certmanager.ClusterIssuer.publickey | required "A valid publickey is required using helm set!"}}
  tls.key: {{ .Values.certmanager.ClusterIssuer.privatekey | required "A valid privatekey is required using helm set!"}}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{.Values.certmanager.ClusterIssuer.name | default "tanzu-sub01-clusterissuer" }}
  namespace: cert-manager
spec:
  ca:
    secretName: {{ .Values.certmanager.ClusterIssuer.name | default "tanzu-sub01-tls-secret" }}
{{ end }}