{{- if .Values.ako.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: avi-default-ingress-cert
  namespace: avi-system
spec:
  commonName: "*.avi.aclab.uk"
  dnsNames:
    - "*.region01.aclab.uk"
    - "*.region02.aclab.uk"
    - "*.aclab.uk"
  secretName: router-certs-default
  issuerRef:
    name: tanzu-sub01-clusterissuer
    kind: ClusterIssuer
{{ end -}}