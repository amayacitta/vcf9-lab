apiVersion: v1
kind: ConfigMap
metadata:
  namespace: external-dns
  name: krb5.conf
data:
  krb5.conf: |
    [logging]
    default = FILE:/var/log/krb5libs.log
    kdc = FILE:/var/log/krb5kdc.log
    admin_server = FILE:/var/log/kadmind.log

    [libdefaults]
    dns_lookup_realm = false
    ticket_lifetime = 24h
    renew_lifetime = 7d
    forwardable = true
    rdns = false
    pkinit_anchors = /etc/pki/tls/certs/ca-bundle.crt
    default_ccache_name = KEYRING:persistent:%{uid}
    #default_ccache_name = FILE:/tmp/krb5cc_%{uid}
    default_realm = CORP.ACLAB.UK
    default_domain = corp.aclab.uk

    [realms]
    CORP.ACLAB.UK = {
      kdc = dc01.corp.aclab.uk
      admin_server = dc01.corp.aclab.uk
      default_domain = corp.aclab.uk
    }

    [domain_realm]
    .corp.aclab.uk = CORP.ACLAB.UK
    corp.aclab.uk  = CORP.ACLAB.UK